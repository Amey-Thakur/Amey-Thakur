#
# DESCRIPTION:
# Renders the contribution grid as an animated snake and publishes it to the
# output branch, where the profile README reads it from.
#
# HOW IT WORKS:
# The snake is built from the public contribution calendar, so it needs no
# checkout of this repository. It is published to a branch of its own rather
# than to main, which is why this workflow never competes with the two card
# workflows for a push.
#
# TECH STACK:
# - GitHub Actions (scheduling and delivery)
# - Platane/snk (contribution snake renderer)
#
# ==============================================================================

name: Amey-Thakur

on:
  schedule:
    # 00:30 local, expressed in UTC. Offset by thirty minutes from the card
    # workflows so the three never run at the same instant.
    - cron: '30 4,16 * * *' 
  
  # Manual trigger: Allows on-demand generation
  workflow_dispatch:
  
  # Structural trigger: Pulse on main branch updates
  push:
    branches:
      - main
  
jobs:
  generate:
    name: Synthesis Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Generates a dynamic contribution snake animation from user metrics
      - name: Generate Contribution Grid Visualization
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Amey-Thakur
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Deploys synthesized assets to the designated 'output' branch for profile integration
      - name: Synchronize Visualizations to Output Branch
        uses: crazy-max/ghaction-github-pages@v2.6.0
        with:
          target_branch: output
          build_dir: dist
          committer: Amey Thakur <ameythakur20@gmail.com>
          author: Amey Thakur <ameythakur20@gmail.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
