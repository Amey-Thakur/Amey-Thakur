# ==============================================================================
#
# DESCRIPTION:
# Regenerates the statistics card and commits it.
#
# HOW IT WORKS:
# GitHub schedules in UTC and cannot express a local time, so the cron below
# holds the due local hours converted at the author's current offset. That
# offset moves twice a year for daylight saving and again on relocation, so
# align_schedule.py records what time each run actually fired and rewrites the
# cron once several runs agree it has drifted.
#
# This workflow stands alone. It shares a schedule with the other card
# workflow, which is safe because each writes its own files: the only path they
# both touch is README.md, where they edit different lines and a rebase merges
# them cleanly. A failure here cannot stop the other from publishing.
#
# Nothing exits early on the clock. A run an hour out of place is preferable to
# one that declines to run.
#
# TECH STACK:
# - GitHub Actions (scheduling and delivery)
# - Python 3 (card generation, timezone resolution)
#
# ==============================================================================

name: Amey-Thakur Stats

on:
  schedule:
    # 00:00 and 12:00 local, expressed in UTC. Rewritten automatically on drift.
    - cron: '0 4,16 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  # Two runs of this workflow must never overlap: both push to main.
  group: stats-card
  cancel-in-progress: false

jobs:
  update-stats:
    name: Amey-Thakur Stats
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # local_time falls back to reading offsets out of the commit history
          # when the profile page is unreachable, which needs full history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Record the run and align the schedule
        continue-on-error: true
        env:
          WORKFLOW_FILE: .github/workflows/stats.yml
        run: |
          python "Source Code/local_time.py"     | tee -a "$GITHUB_STEP_SUMMARY"
          python "Source Code/align_schedule.py" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate statistics card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "Source Code/stats.py"

      - name: Configure commit signing
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          # Commits must be signed by the author's own key, not by GitHub.
          #
          # GitHub will sign a commit for free if it is created through the API
          # rather than with git, but it then records github-actions[bot] as the
          # author, and a bot's commits do not count towards the author's
          # contribution graph. Since a daily contribution is the reason this
          # workflow exists, that trade is not worth taking.
          #
          # So the author's own SSH signing key is used instead, supplied as a
          # secret. Without it the run continues and simply produces unsigned
          # commits, because a missing key should not cost a day's activity.
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::COMMIT_SIGNING_KEY is not set. Commits will be unsigned."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SIGNING_KEY" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub

          git config --local gpg.format ssh
          git config --local user.signingkey ~/.ssh/signing_key.pub
          git config --local commit.gpgsign true
          echo "Signing configured."

      - name: Commit and push
        run: |
          git config --local user.email "ameythakur20@gmail.com"
          git config --local user.name  "Amey Thakur"

          # Runners are fixed to UTC. Stamping at the author's offset keeps the
          # history readable in his own time, and leaves a non-UTC timestamp for
          # local_time's fallback to find. Without it every recent commit reads
          # +00:00 and that fallback resolves to UTC wherever he actually is.
          LOCAL_DATE=$(python -c "import sys; sys.path.insert(0, 'Source Code'); import local_time as t; print(t.local_now().strftime('%Y-%m-%dT%H:%M:%S%z'))")
          export GIT_AUTHOR_DATE="$LOCAL_DATE"
          export GIT_COMMITTER_DATE="$LOCAL_DATE"

          # The generator rewrites the cache-busting query string on its README
          # image every run, so a commit exists even when the figures have not
          # moved.
          git add docs/stats.svg docs/stats_cache.json README.md docs/schedule_state_stats.json
          git commit -m "Amey-Thakur"                      -m "Co-authored-by: Mega Satish <mega.modha@gmail.com>"                      --author="Amey Thakur <ameythakur20@gmail.com>"             || { echo "Nothing to commit."; exit 0; }

          # The other card workflow shares this schedule and also pushes to
          # main, and the two sit in different concurrency groups, so GitHub
          # does not serialise them. Rebasing handles a push that has already
          # landed; it cannot handle one that lands between the rebase and the
          # push, which rejects the push. Retry the pair so that losing a race
          # costs a few seconds rather than the day's commit.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "push attempt $attempt was beaten to main; retrying."
            sleep "$((attempt * 5))"
          done
          echo "::error::could not push after five attempts"
          exit 1
